name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python tools/quality.py check
      - name: Offline E2E integration (mocked KVK)
        run: python -m pytest -q tests/test_ci_e2e_integration.py
      - name: Validate POSIX wrappers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/*.sh
          scripts/host-preflight.sh
          touch /tmp/company-harvest-dry-run.whl
          scripts/install.sh /tmp/company-harvest-dry-run.whl /tmp/company-harvest-dry-run-venv --dry-run
      - name: Validate PowerShell wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/host-preflight.ps1
          New-Item -ItemType File -Path company-harvest-dry-run.whl | Out-Null
          ./scripts/install.ps1 -Wheel company-harvest-dry-run.whl -Venv company-harvest-dry-run-venv -DryRun
