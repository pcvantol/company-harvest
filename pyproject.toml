[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "company-harvest"
version = "3.1.0"
description = "Lokale, auditbare tooling voor Nederlandse bedrijfsverzameling en lijstmerge"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{name = "Company Harvest contributors"}]
dependencies = [
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "playwright==1.55.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "coverage==7.10.7",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[project.scripts]
company-harvest = "company_harvest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_harvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/company_harvest", "tools"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501", "E701", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["company_harvest"]
ignore_missing_imports = true
